name: Weekly feeder-band check

on:
  schedule:
    # Every Monday 06:00 UTC (~07:00 WAT). Adjust as you like.
    - cron: "0 6 * * 1"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx scripts/ingest.ts
      # TODO once ingest.ts is real: open a PR (or commit directly) with
      # any auto-published changes, and fail/notify (e.g. a Slack or
      # email step) when scripts/flagged.json is non-empty, so the
      # weekly manual review has something to act on.
